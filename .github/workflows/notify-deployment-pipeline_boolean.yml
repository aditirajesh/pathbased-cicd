name: Notify pipeline repo

on:
  push:
    branches: [ main, develop ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'dev/terraform/**'
            code:
              - 'dev/backend/**'
              - 'dev/frontend/**'
              - 'dev/database/**'
              - 'dev/parameters/**'

  dispatch:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Send event to Repo B
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOYMENT_REPO }}
          repository: aditirajesh/deployment-repo
          event-type: repo-a-change
          client-payload: |
            {
              "source_repo": "${{ github.repository }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "terraform_changed": "${{ needs.changes.outputs.terraform }}",
              "code_changed": "${{ needs.changes.outputs.code }}"
            }
