name: CI/CD 2

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'dev/terraform/**'
            code:
              - 'dev/backend/**'
              - 'dev/frontend/**'
              - 'dev/database/**'
              - 'dev/parameters/**'

  build_and_deploy_code:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run backend script
        run: bash dev/backend/run_backend.sh
      - name: Run frontend script
        run: bash dev/frontend/run_frontend.sh
      - name: Run database script
        run: bash dev/database/run_database.sh
      - name: Read parameters
        run: cat dev/parameters/params.json

  terraform_plan:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: dev/terraform
        run: terraform init
      - name: Terraform Plan
        working-directory: dev/terraform
        run: terraform plan -out=tfplan
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: dev/terraform/tfplan

  terraform_apply:
    runs-on: ubuntu-latest
    needs: [changes, terraform_plan]
    if: ${{ needs.changes.outputs.terraform == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: dev/terraform
      - name: Terraform Init
        working-directory: dev/terraform
        run: terraform init
      - name: Terraform Apply
        working-directory: dev/terraform
        run: terraform apply -auto-approve tfplan
